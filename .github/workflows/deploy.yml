name: Deploy a produccion

# Se ejecuta al subir cualquier tag nuevo.
on:
  push:
    tags: ["**"]

permissions:
  contents: read

# Un solo deploy a la vez; no se cancela uno que ya esta en curso.
concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  # No se despliega nada que no pase el linter y los tests.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy en Render
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Verificar secretos
        run: |
          for name in RENDER_DEPLOY_HOOK_URL RENDER_API_KEY RENDER_SERVICE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name en el repositorio."
              exit 1
            fi
          done

      - name: Desplegar el commit del tag y esperar el resultado
        run: |
          # ref asegura que se despliegue exactamente el commit del tag, y no el ultimo de main.
          response=$(curl -sS --fail-with-body -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          deploy_id=$(echo "$response" | jq -r '.deploy.id // empty' 2>/dev/null || true)
          if [ -z "$deploy_id" ]; then
            echo "::error::Render no devolvio un id de deploy (puede haber otro deploy en curso)."
            exit 1
          fi
          echo "Deploy $deploy_id iniciado para el tag $GITHUB_REF_NAME ($GITHUB_SHA)"

          while true; do
            # Un fallo puntual de la API no corta la espera; el limite lo pone timeout-minutes.
            status=$(curl -sS --fail \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              | jq -r '.status') || status="sin respuesta"
            echo "Estado: $status"
            case "$status" in
              live)
                echo "Deploy exitoso."
                exit 0
                ;;
              build_failed | update_failed | pre_deploy_failed | canceled | deactivated)
                echo "::error::El deploy termino en estado $status. Revisa los logs en Render."
                exit 1
                ;;
            esac
            sleep 15
          done
