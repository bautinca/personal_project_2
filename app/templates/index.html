<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Text Entries</title>
</head>
<body>
    <h1>Ingresa un texto</h1>
    <form method="post" action="/">
        <input type="text" name="text" required>
        <button type="submit">enviar</button>
    </form>

    <h2>Textos guardados</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Texto</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for entry in entries %}
            <tr>
                <td>{{ entry.id }}</td>
                <td>{{ entry.text }}</td>
                <td>
                    <form method="post" action="/entries/{{ entry.id }}/edit">
                        <input type="text" name="text" value="{{ entry.text }}" aria-label="Nuevo texto" required>
                        <button type="submit">modificar</button>
                    </form>
                    <form method="post" action="/entries/{{ entry.id }}/delete">
                        <button type="submit">eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
